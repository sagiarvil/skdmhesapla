<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
  </defs>
  
  <!-- Outer border -->
  <rect x="20" y="20" width="760" height="520" rx="12" fill="url(#bgGrad)" stroke="#d4c5b0" stroke-width="4"/>
  <rect x="36" y="36" width="728" height="488" rx="8" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Header -->
  <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="24" fill="#1b382b" letter-spacing="2">GAZİANTEP ÜNİVERSİTESİ / GSO-MEM</text>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#665b4e" letter-spacing="1">MESLEKİ EĞİTİM VE SÜREKLİ GELİŞİM MERKEZİ</text>
  
  <line x1="200" y1="140" x2="600" y2="140" stroke="#b8860b" stroke-width="1"/>

  <!-- Certificate Title -->
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#1b382b">EĞİTİM VE YETKİNLİK BELGESİ</text>
  <text x="400" y="225" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#b8860b">ISO 14064-1 SERA GAZI EMİSYON HESAPLAMA EĞİTİMİ</text>

  <!-- Body -->
  <text x="400" y="280" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="15" fill="#443e37">Bu belge, Sayın</text>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#1b382b">BARIŞ BAĞIRLAR</text>
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="14" fill="#443e37">tarafından ISO 14064-1 standardı kapsamında Kapsam 1, 2 ve 3 Sera Gazı</text>
  <text x="400" y="382" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="14" fill="#443e37">Emisyon Hesaplama Eğitimi programını başarıyla tamamladığını belgelendirir.</text>

  <!-- Masked Notice Badge -->
  <rect x="220" y="420" width="360" height="30" rx="15" fill="#e8f0ec" stroke="#2d5a43" stroke-width="1"/>
  <text x="400" y="440" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#1b382b">✓ Resmi Doğrulama Kaydı: GSO-MEM-14064-2024-089</text>

  <!-- Footer Seal -->
  <circle cx="120" cy="460" r="36" fill="url(#goldGrad)"/>
  <text x="120" y="465" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff">ISO 14064</text>
  <text x="680" y="475" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#887e71">E-E-A-T Verified Asset</text>
</svg>
