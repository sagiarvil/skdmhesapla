name: seo-generated-sync-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seo-generated-sync-one-shot.yml

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'chore: sync generated SEO assets' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SEO and AI assets
        run: npm run ai:generate
      - name: Commit deterministic generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public data/seo/sitemap-baseline.json data/seo/markdown-manifest.json
          if git diff --cached --quiet; then
            echo "Generated assets already in sync."
            exit 0
          fi
          git commit -m "chore: sync generated SEO assets"
          git push origin HEAD:main
