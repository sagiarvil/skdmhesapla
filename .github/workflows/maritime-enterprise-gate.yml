name: maritime-enterprise-gate

on:
  pull_request:
    paths:
      - 'data/maritime/**'
      - 'functions/maritime-backend-v2.js'
      - 'functions/maritime-backend-v3.js'
      - 'functions/maritime-compliance-audit-v1.js'
      - 'functions/maritime-commerce-v1.js'
      - 'functions/maritime-commerce-v2.js'
      - 'functions/maritime-commerce-webhook-v1.js'
      - 'functions/main.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'src/lib/maritime/**'
      - 'src/lib/skdm/paddle.ts'
      - 'src/components/maritime/**'
      - 'tests/maritime/**'
      - 'scripts/paddle-sync-maritime.mjs'
      - 'scripts/assert-maritime-enterprise-backend.mjs'
      - '.github/workflows/maritime-enterprise-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-enterprise-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Maritime governance contract
        run: node scripts/assert-maritime-enterprise-backend.mjs

      - name: Strict maritime audit regression
        run: node tests/maritime/strict-audit-core.spec.cjs

      - name: Cloud Functions syntax
        run: |
          node --check functions/maritime-backend-v2.js
          node --check functions/maritime-backend-v3.js
          node --check functions/maritime-compliance-audit-v1.js
          node --check functions/maritime-commerce-v1.js
          node --check functions/maritime-commerce-v2.js
          node --check functions/maritime-commerce-webhook-v1.js
          node --check functions/main.js
          node --check scripts/paddle-sync-maritime.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify maritime preparation export
        run: |
          test -f out/denizcilik/index.html
          test -f out/denizcilik/kapsam-kontrolu/index.html
          test -f out/denizcilik/dosya-hazirla/index.html
