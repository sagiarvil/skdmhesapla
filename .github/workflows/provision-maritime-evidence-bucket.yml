name: provision-maritime-evidence-bucket

on:
  push:
    branches: [main]
    paths:
      - 'scripts/e2e/provision-maritime-evidence-bucket.ts'
      - '.github/workflows/provision-maritime-evidence-bucket.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Provision and verify maritime evidence bucket
        run: npx tsx scripts/e2e/provision-maritime-evidence-bucket.ts
