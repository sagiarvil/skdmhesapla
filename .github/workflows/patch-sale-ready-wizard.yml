name: one-shot-sale-ready-wizard-migration

on:
  push:
    paths:
      - '.github/workflows/patch-sale-ready-wizard.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate legacy CBAM client seal to server-authoritative launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/wizard/SkdmWizard.tsx')
          s = p.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'PATCH MISS: {label}')
              s = s.replace(old, new, 1)

          once('import { createSealedAuditPackage, type SealedPackageOutput } from "@/lib/skdm/package-seal";\nimport { registerSealedPackage } from "@/lib/skdm/sealRegistryClient";\n',
               'import type { SealedPackageOutput } from "@/lib/skdm/package-seal";\n',
               'remove client package authority imports')

          once('import { routeVerdict, type VerdictRoute } from "@/lib/skdm/resolve-scope";\n',
               'import { routeVerdict, type VerdictRoute } from "@/lib/skdm/resolve-scope";\nimport { authFetch } from "@/lib/api/auth-fetch";\n',
               'add authFetch')

          once('// Gate 7 — RM otorite + resmî şablon + sentetik veri kapıları kapanmadan CBAM seal kapalı.\nconst CBAM_SEAL_V2_READY = false;\n\n',
               '',
               'remove static false seal gate')

          once('  const [sealModalOpen, setSealModalOpen] = useState(false);\n  const [paidTxn, setPaidTxn] = useState<string | null>(null);\n',
               '  const [sealModalOpen, setSealModalOpen] = useState(false);\n  const [cbamServerReady, setCbamServerReady] = useState(false);\n  const [sealSyncError, setSealSyncError] = useState<string | null>(null);\n',
               'replace paid transaction state')

          marker = '''  useEffect(() => {\n    emitFunnelEvent("wizard_started", { sectorSlug });\n  }, [sectorSlug]);\n\n'''
          insert = '''  useEffect(() => {\n    emitFunnelEvent("wizard_started", { sectorSlug });\n  }, [sectorSlug]);\n\n  // Ücretli CBAM teslimi yalnız canlı sunucu-otoriteli kapı açıkken etkinleşir.\n  // Ağ/API sorunu varsa fail-closed: ödeme butonu açılmaz.\n  useEffect(() => {\n    if (sector.tier !== "A") {\n      setCbamServerReady(true);\n      return;\n    }\n    let cancelled = false;\n    void (async () => {\n      try {\n        const res = await authFetch("/api/cbam/feature-flags");\n        const body = res.ok\n          ? (await res.json()) as { cbamServerAuthoritativeSealReady?: boolean; paidSealDataPolicy?: string }\n          : null;\n        if (!cancelled) {\n          setCbamServerReady(Boolean(\n            body?.cbamServerAuthoritativeSealReady && body?.paidSealDataPolicy === "actual-data-only"\n          ));\n        }\n      } catch {\n        if (!cancelled) setCbamServerReady(false);\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [sector.tier]);\n\n'''
          once(marker, insert, 'server readiness effect')

          once('  const sealBlocked = hasBlockingQc(qc) || result.readinessScore !== 100 || !CBAM_SEAL_V2_READY;\n',
               '  const sealBlocked = hasBlockingQc(qc) || result.readinessScore !== 100 || (sector.tier === "A" && !cbamServerReady);\n',
               'dynamic seal gate')

          once('  const sealReady = result.readinessScore === 100 && !hasBlockingQc(qc);\n',
               '  const sealReady = result.readinessScore === 100 && !hasBlockingQc(qc) && (sector.tier !== "A" || cbamServerReady);\n',
               'dynamic seal ready')

          start = s.index('  const performSealA = async (transactionId: string) => {')
          end = s.index('  const handleSeal = async () => {', start)
          s = s[:start] + s[end:]

          old_handle = '''  const handleSeal = async () => {\n    if (sealBlocked) return;\n    emitFunnelEvent("seal_intent", { sectorSlug });\n\n    if (sector.tier !== "A") {\n      const packageId = `TKD-${year}-${trUpper(sectorSlug.slice(0, 2))}-${trUpper(sessionId.slice(-4))}`;\n      const girdi = buildTkdGirdisiFromWizard({\n        sector,\n        fieldValues,\n        goods,\n        streams,\n        precs,\n        uretimMiktari: volume,\n        timestamp: new Date().toISOString(),\n        packageId,\n      });\n      const pdf = tedarikciKarbonDosyasiPdfBytes(girdi);\n      const copy = new Uint8Array(pdf.byteLength);\n      copy.set(pdf);\n      const blob = new Blob([copy], { type: "application/pdf" });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement("a");\n      a.href = url;\n      a.download = TKD_FILENAME;\n      a.click();\n      URL.revokeObjectURL(url);\n      setSealedVaryant("tkd");\n      setSealedName(TKD_FILENAME);\n      return;\n    }\n\n    if (paidTxn) {\n      await performSealA(paidTxn);\n      return;\n    }\n    setSealModalOpen(true);\n  };\n'''
          new_handle = '''  const handleSeal = async () => {\n    if (sealBlocked) return;\n    emitFunnelEvent("seal_intent", { sectorSlug });\n\n    if (sector.tier !== "A") {\n      const packageId = `TKD-${year}-${trUpper(sectorSlug.slice(0, 2))}-${trUpper(sessionId.slice(-4))}`;\n      const girdi = buildTkdGirdisiFromWizard({\n        sector,\n        fieldValues,\n        goods,\n        streams,\n        precs,\n        uretimMiktari: volume,\n        timestamp: new Date().toISOString(),\n        packageId,\n      });\n      const pdf = tedarikciKarbonDosyasiPdfBytes(girdi);\n      const copy = new Uint8Array(pdf.byteLength);\n      copy.set(pdf);\n      const blob = new Blob([copy], { type: "application/pdf" });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement("a");\n      a.href = url;\n      a.download = TKD_FILENAME;\n      a.click();\n      URL.revokeObjectURL(url);\n      setSealedVaryant("tkd");\n      setSealedName(TKD_FILENAME);\n      return;\n    }\n\n    // Ödeme penceresi açılmadan hemen önce son kanonik taslağı sunucuya yaz.\n    // 10 saniyelik otomatik kayıt aralığına güvenilmez; stale-session ile ödeme yapılamaz.\n    setSealSyncError(null);\n    const finalDraft: SkdmSessionDraft = {\n      sessionId,\n      sectorSlug,\n      createdAt,\n      updatedAt: new Date().toISOString(),\n      step,\n      fieldValues,\n      skippedFields: skipped,\n      goods,\n      processes,\n      streams,\n      precs,\n      dProcesses: { a: dA, b: dB, c: dC, d: dD },\n      ePurchPrec: precs.map((p) => ({ total: p.total, internal: p.internal, other: p.other })),\n      importerAnnualVolumeStatus: importerVolume,\n      noVerifier,\n      status: "draft",\n    };\n    const sync = await saveSessionDraft(finalDraft);\n    setRemoteOk(sync.remoteOk);\n    if (!sync.remoteOk) {\n      setSealSyncError("Çalışmanız sunucuya güvenli biçimde kaydedilemedi. Ödeme alınmadı; bağlantınızı kontrol edip tekrar deneyin.");\n      return;\n    }\n    setSealModalOpen(true);\n  };\n'''
          once(old_handle, new_handle, 'replace handleSeal')

          once('''              {!hasBlockingQc(qc) && result.readinessScore === 100 && !CBAM_SEAL_V2_READY && (\n                <p className="rounded-2xl p-4 text-sm sm:text-base font-semibold" style={{ background: T.amberWash, color: "#5C4310" }}>\n                  SKDM mühürlü paket üretimi; resmî iletişim şablonu ve hesaplama otoritesi kayıtları tamamlanana kadar geçici olarak kapalıdır. Verileriniz çalışmada saklı kalır; mühürleme açıldığında ödeme ve indirme buradan devam eder.\n                </p>\n              )}\n''',
               '''              {sector.tier === "A" && !hasBlockingQc(qc) && result.readinessScore === 100 && !cbamServerReady && (\n                <p className="rounded-2xl p-4 text-sm sm:text-base font-semibold" style={{ background: T.amberWash, color: "#5C4310" }}>\n                  Güvenli ödeme ve sunucu-mühürlü teslim hattı şu anda hazır değil. Bu durumda ödeme alınmaz; çalışmanız taslak olarak korunur.\n                </p>\n              )}\n              {sealSyncError && (\n                <p className="rounded-2xl p-4 text-sm sm:text-base font-semibold" style={{ background: T.clayWash, color: T.clay }}>\n                  {sealSyncError}\n                </p>\n              )}\n''',
               'replace legacy seal notice')

          once('''        onPaid={(transactionId) => {\n          setPaidTxn(transactionId);\n          setSealModalOpen(false);\n          void performSealA(transactionId);\n        }}\n''',
               '''        onPaid={() => {\n          // CBAM teslimi SealModal içinde yalnız /api/cbam sunucu zincirinden yapılır.\n          setSealModalOpen(false);\n        }}\n''',
               'remove client paid callback')

          # No active CBAM client-authority implementation may remain.
          forbidden = ['registerSealedPackage(', 'performSealA(', 'packageId: pkg.packageId', 'masterHash: pkg.masterHash']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'FORBIDDEN CLIENT AUTHORITY REMAINS: {token}')

          p.write_text(s)
          PY

          git diff --check
          grep -q 'cbamServerReady' src/components/wizard/SkdmWizard.tsx
          ! grep -q 'CBAM_SEAL_V2_READY' src/components/wizard/SkdmWizard.tsx
          ! grep -q 'registerSealedPackage' src/components/wizard/SkdmWizard.tsx
      - name: Commit migration
        run: |
          git config user.name "skdm-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/wizard/SkdmWizard.tsx
          git commit -m "feat(wizard): activate server-authoritative CBAM paid delivery"
          git push origin HEAD:main
