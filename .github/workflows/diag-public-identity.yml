name: diag-public-identity
on:
  push:
    paths:
      - '.github/workflows/diag-public-identity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate identity references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('src'),Path('scripts'),Path('functions')]
          pats=[re.compile(r'\b(?:SITE|LEGAL_ENTITY|ISLETMECI)\.vkn(?:Label)?\b'),re.compile(r'TCKN|T\.C\. Kimlik|Kimlik No',re.I),re.compile(r'(?<!\d)\d{11}(?!\d)')]
          for root in roots:
            for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.ts','.tsx','.js','.mjs','.json','.md'}: continue
              try: text=p.read_text(errors='ignore')
              except: continue
              hits=[]
              for i,line in enumerate(text.splitlines(),1):
                if any(rx.search(line) for rx in pats):
                  safe=re.sub(r'(?<!\d)\d{11}(?!\d)','[REDACTED-11-DIGIT]',line)
                  hits.append(f'{p}:{i}: {safe.strip()}')
              if hits: print('\n'.join(hits))
          PY
