name: sync-commercial-seo-generated

on:
  push:
    branches: [main]
    paths:
      - 'data/seo/registry-commercial.json'
      - 'data/seo/ai-resources-commercial.json'

permissions:
  contents: write

concurrency:
  group: sync-commercial-seo-generated
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate SEO and AI artifacts
        run: npm run ai:generate
      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public data/seo/markdown-manifest.json data/seo/sitemap-baseline.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git commit -m "chore: sync generated SEO assets"
          git push origin HEAD:main
