name: revenue-growth-os

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, growth/revenue-os-v2]

permissions:
  contents: read

jobs:
  growth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Revenue Growth OS contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GtipArama' src/app/page.tsx
          grep -q 'GROWTH_EVENT_ALIAS' src/lib/seo/funnel-events.ts
          for event in tool_start tool_step tool_complete tool_result cta_view lead_submit checkout_start purchase; do
            grep -q "\"$event\"" src/lib/seo/funnel-events.ts
          done
          for field in event_id session_id traffic_source first_touch last_touch timestamp; do
            grep -q "$field" src/lib/seo/funnel-events.ts
          done
          if grep -Eq 'anonymous_user_id|localStorage' src/lib/seo/funnel-events.ts; then
            echo 'Persistent/unconsented identity storage forbidden in SKDM growth SDK'; exit 1;
          fi
          echo 'REVENUE_GROWTH_OS_PASS'
