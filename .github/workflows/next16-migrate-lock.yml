name: next16-migrate-lock

on:
  push:
    branches: [next16-security-migration]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): migrate to Next 16') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade supported framework dependencies
        run: |
          npm install --save-exact next@16.3.1 react@latest react-dom@latest
          npm install --save-dev @types/react@latest @types/react-dom@latest
      - name: Audit production dependency tree
        run: npm audit --omit=dev || true
      - name: Commit generated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): migrate to Next 16" || exit 0
          git push origin HEAD:next16-security-migration
