name: next16-migrate-lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.head_ref == 'next16-security-migration' && !contains(github.event.pull_request.head.label, ':dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade framework and generate lock
        run: |
          npm install --save-exact next@16.3.1 react@latest react-dom@latest
          npm install --save-dev @types/react@latest @types/react-dom@latest
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated dependency state
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): migrate to Next 16"
          git push origin HEAD:${{ github.head_ref }}
