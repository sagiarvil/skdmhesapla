name: deploy-hosting-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hosting-live.yml'
      - 'src/app/fiyatlandirma/**'
      - 'src/lib/skdm/package-manifest.ts'
      - 'src/lib/skdm/constants.ts'
      - 'src/config/isletmeci.ts'

concurrency:
  group: deploy-hosting-live
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NEXT_PUBLIC_PADDLE_ENV: production
  NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_399: pri_01m1rdd20amd3730r561vckwm3

jobs:
  deploy:
    name: Build and deploy SKDMHesapla production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and syntax gates
        run: |
          npm run typecheck
          node --check functions/maritime-commerce-v1.js
          node --check functions/maritime-commerce-webhook-v1.js
          node --check functions/main.js

      - name: Verify premium pricing readability source authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'text-\[44px\]' src/app/fiyatlandirma/page.tsx
          grep -q 'xl:grid-cols-3' src/app/fiyatlandirma/page.tsx
          grep -q 'text-base font-black leading-6 text-ink-900' src/app/fiyatlandirma/page.tsx
          grep -q 'text-sm font-medium leading-6 text-ink-700' src/app/fiyatlandirma/page.tsx
          ! grep -q 'line-clamp-2' src/app/fiyatlandirma/page.tsx
          ! grep -Eq 'text-\[(9|10|11)px\]' src/app/fiyatlandirma/page.tsx

      - name: Verify maritime 399 USD source authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARITIME_DOSSIER_1Y_399_USD' src/lib/skdm/paddle.ts
          grep -q 'MARITIME_DOSSIER_PRICE_USD = 399' src/lib/maritime/commerce-client.ts
          grep -q 'MARITIME_DOSSIER_1Y_399_USD' functions/maritime-commerce-v1.js
          grep -q 'UNIT_AMOUNT_MINOR = 39900' functions/maritime-commerce-v1.js
          grep -q 'MARITIME_DOSSIER_1Y_399_USD' functions/maritime-commerce-webhook-v1.js
          grep -q 'UNIT_AMOUNT_MINOR = 39900' functions/maritime-commerce-webhook-v1.js
          ! grep -q '349 USD' src/components/maritime/MaritimePreparationEnterpriseBridge.tsx
          ! grep -q '349 USD' src/components/maritime/MaritimePaidDossierView.tsx

      - name: Build static site
        env:
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: '${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}'
          NEXT_PUBLIC_PADDLE_PRICE_SEALED: '${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_SEALED }}'
        run: npm run build

      - name: Verify production export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/fiyatlandirma/index.html
          test -f out/denizcilik/dosya-hazirla/index.html
          grep -q '399' out/fiyatlandirma/index.html
          grep -q 'text-\[44px\]' out/fiyatlandirma/index.html
          grep -R -q 'MARITIME_DOSSIER_1Y_399_USD' out/_next/static
          grep -R -q 'Nihai dosyayı al — 399 USD' out/_next/static
          ! grep -R -q 'Nihai dosyayı al — 349 USD' out/_next/static

      - name: Deploy Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
          channelId: live
          projectId: carbon-web-1265b
          target: skdmhesapla

      - name: Verify live pricing and maritime bundle
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            pricing="$(curl -fsSL --retry 2 --retry-delay 3 https://skdmhesapla.com/fiyatlandirma/ || true)"
            prep="$(curl -fsSL --retry 2 --retry-delay 3 https://skdmhesapla.com/denizcilik/dosya-hazirla/ || true)"
            pricing_ok=0
            readability_ok=0
            maritime_ok=0
            if printf '%s' "$pricing" | grep -q '399'; then pricing_ok=1; fi
            if printf '%s' "$pricing" | grep -q 'text-\[44px\]' && printf '%s' "$pricing" | grep -q 'xl:grid-cols-3'; then readability_ok=1; fi
            assets="$(printf '%s' "$prep" | grep -oE '/_next/static/[^"[:space:]]+\.js' | sort -u || true)"
            for asset in $assets; do
              if curl -fsSL "https://skdmhesapla.com${asset}" 2>/dev/null | grep -q 'MARITIME_DOSSIER_1Y_399_USD'; then
                maritime_ok=1
                break
              fi
            done
            if [ "$pricing_ok" = "1" ] && [ "$readability_ok" = "1" ] && [ "$maritime_ok" = "1" ]; then
              echo "LIVE VERIFIED: premium-readable pricing typography and 399 USD maritime bundle are live."
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed."
          exit 1
