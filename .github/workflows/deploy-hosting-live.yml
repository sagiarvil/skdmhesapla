name: deploy-hosting-live

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-hosting-live
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy SKDMHesapla production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check maritime backend syntax
        run: |
          node --check functions/maritime-backend-v2.js
          node --check functions/main.js

      - name: Build static site
        run: npm run build

      - name: Verify maritime export
        shell: bash
        run: |
          test -f out/denizcilik/index.html
          test -f out/denizcilik/kapsam-kontrolu/index.html
          test -f out/denizcilik/eu-mrv/index.html
          test -f out/denizcilik/eu-ets/index.html
          test -f out/denizcilik/fueleu/index.html
          test -f out/denizcilik/cbam-ihracatci-masasi/index.html
          test -f out/denizcilik/dosya-hazirla/index.html

      - name: Deploy maritime backend and security rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
        run: |
          set -euo pipefail
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          trap 'rm -f "$SA_FILE"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx firebase-tools deploy \
            --project carbon-web-1265b \
            --only functions:skdmhesapla:maritimeApi,firestore,storage \
            --non-interactive

      - name: Deploy Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
          channelId: live
          projectId: carbon-web-1265b
          target: skdmhesapla

      - name: Verify live maritime routes and API boundary
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            home_ok=0
            prep_ok=0
            api_ok=0
            if curl -fsSL --retry 2 --retry-delay 3 https://skdmhesapla.com/denizcilik/ | grep -q "Denizcilik"; then home_ok=1; fi
            if curl -fsSL --retry 2 --retry-delay 3 https://skdmhesapla.com/denizcilik/dosya-hazirla/ | grep -q "Denizcilik Karbon Uyum Hazırlık Dosyası"; then prep_ok=1; fi
            code=$(curl -sS -o /tmp/maritime-api-body -w "%{http_code}" https://skdmhesapla.com/api/maritime/health || true)
            if [ "$code" = "401" ]; then api_ok=1; fi
            if [ "$home_ok" = "1" ] && [ "$prep_ok" = "1" ] && [ "$api_ok" = "1" ]; then
              echo "Live maritime UI and authenticated API boundary verified."
              exit 0
            fi
            sleep 5
          done
          echo "Live maritime verification failed."
          cat /tmp/maritime-api-body || true
          exit 1
