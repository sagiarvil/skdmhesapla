name: one-shot-commercial-release-guard

on:
  push:
    paths:
      - '.github/workflows/patch-commercial-release-guard.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate server capability from commercial release
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'PATCH MISS {path}: {label}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
            'functions/cbam-seal-v2.js',
            '''          cbamServerAuthoritativeSealReady: true,\n          paidSealDataPolicy: "actual-data-only",\n          officialDefaultValueFallbackSealable: false,\n''',
            '''          cbamServerAuthoritativeSealReady: true,\n          commercialReleaseReady: false,\n          paymentToDownloadE2EReady: false,\n          paidSealDataPolicy: "actual-data-only",\n          officialDefaultValueFallbackSealable: false,\n''',
            'feature flags commercial lock'
          )

          replace_once(
            'src/components/wizard/SkdmWizard.tsx',
            '''          ? (await res.json()) as { cbamServerAuthoritativeSealReady?: boolean; paidSealDataPolicy?: string }\n          : null;\n        if (!cancelled) {\n          setCbamServerReady(Boolean(\n            body?.cbamServerAuthoritativeSealReady && body?.paidSealDataPolicy === "actual-data-only"\n          ));\n''',
            '''          ? (await res.json()) as { cbamServerAuthoritativeSealReady?: boolean; commercialReleaseReady?: boolean; paidSealDataPolicy?: string }\n          : null;\n        if (!cancelled) {\n          setCbamServerReady(Boolean(\n            body?.cbamServerAuthoritativeSealReady &&\n            body?.commercialReleaseReady &&\n            body?.paidSealDataPolicy === "actual-data-only"\n          ));\n''',
            'wizard commercial gate'
          )

          replace_once(
            'src/components/seal/SealModal.tsx',
            '''    const body = (await response.json()) as {\n      cbamServerAuthoritativeSealReady?: boolean;\n      paidSealDataPolicy?: string;\n    };\n    if (!body.cbamServerAuthoritativeSealReady) {\n      throw new Error("CBAM paket sunucusu kalite kapısında");\n    }\n    if (body.paidSealDataPolicy !== "actual-data-only") {\n      throw new Error("CBAM veri politikası doğrulanamadı");\n    }\n''',
            '''    const body = (await response.json()) as {\n      cbamServerAuthoritativeSealReady?: boolean;\n      commercialReleaseReady?: boolean;\n      paidSealDataPolicy?: string;\n    };\n    if (!body.cbamServerAuthoritativeSealReady) {\n      throw new Error("CBAM paket sunucusu kalite kapısında");\n    }\n    if (!body.commercialReleaseReady) {\n      throw new Error("Ücretli CBAM teslimi production ödeme kabulü tamamlanana kadar kapalıdır");\n    }\n    if (body.paidSealDataPolicy !== "actual-data-only") {\n      throw new Error("CBAM veri politikası doğrulanamadı");\n    }\n''',
            'modal commercial gate'
          )

          # Server seal endpoint itself must also refuse commercial traffic while release is locked.
          replace_once(
            'functions/cbam-seal-v2.js',
            '''async function handleSeal(req, res) {\n  if (req.method !== "POST") return fail(res, 405, "POST gerekli");\n  const auth = await requireUser(req);\n''',
            '''async function handleSeal(req, res) {\n  if (req.method !== "POST") return fail(res, 405, "POST gerekli");\n  // Production ödeme→indirme kabulü tamamlanana kadar yalnız UI değil API de fail-closed.\n  return fail(res, 503, "Ücretli CBAM teslimi production kabul testi tamamlanana kadar kapalıdır");\n\n  /* c8 ignore next 2 -- release açıldığında bu erken dönüş kaldırılır. */\n  const auth = await requireUser(req);\n''',
            'server commercial hard stop'
          )

          # Guard against accidental payment activation.
          text = Path('functions/cbam-seal-v2.js').read_text()
          assert 'commercialReleaseReady: false' in text
          assert 'production kabul testi tamamlanana kadar kapalıdır' in text
          assert 'cbamServerAuthoritativeSealReady: true' in text
          PY
          git diff --check
      - name: Commit migration
        run: |
          git config user.name "skdm-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/cbam-seal-v2.js src/components/wizard/SkdmWizard.tsx src/components/seal/SealModal.tsx
          git commit -m "feat(commerce): hard-lock CBAM payments until production E2E acceptance"
          git push origin HEAD:main
