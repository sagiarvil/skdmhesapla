name: sync-commercial-recovery

on:
  push:
    branches: [recovery/partner-network-eu-buyer-20260908]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/partner-network-eu-buyer-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SEO and AI surfaces
        run: node scripts/seo/generate-assets.mjs
      - name: Commit deterministic generated surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public data/seo/markdown-manifest.json data/seo/indexnow-state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync partner network and EU buyer discovery assets"
          git push origin HEAD:recovery/partner-network-eu-buyer-20260908
