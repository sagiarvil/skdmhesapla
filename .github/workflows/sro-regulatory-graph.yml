name: sro-regulatory-graph

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regulatory-authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate registry-backed AI and SEO artifacts
        run: npm run ai:generate
      - name: Verify official-source regulatory graph, LLMS depth and portfolio ownership
        run: node scripts/seo/verify-sro-regulatory-graph.mjs
      - name: Run existing AI audit
        run: npm run ai:validate
      - name: Run existing full SEO audit
        run: npm run seo:audit
