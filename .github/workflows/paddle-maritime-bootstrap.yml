name: paddle-maritime-bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paddle-maritime-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: paddle-maritime-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_PADDLE_ENV: production
      NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_399: pri_01m1rdd20amd3730r561vckwm3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Authenticate Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - name: Resolve existing Paddle.js client token
        shell: bash
        env:
          CLIENT_TOKEN_GITHUB: '${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}'
        run: |
          set -euo pipefail
          CLIENT_TOKEN="$CLIENT_TOKEN_GITHUB"
          if [ -z "$CLIENT_TOKEN" ]; then
            TOKEN_FILE="$RUNNER_TEMP/paddle-client-token-existing"
            if npx firebase-tools functions:secrets:access NEXT_PUBLIC_PADDLE_CLIENT_TOKEN --project carbon-web-1265b > "$TOKEN_FILE" 2>/dev/null; then
              CLIENT_TOKEN="$(cat "$TOKEN_FILE")"
            fi
          fi
          test -n "$CLIENT_TOKEN"
          echo "::add-mask::$CLIENT_TOKEN"
          echo "NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=$CLIENT_TOKEN" >> "$GITHUB_ENV"

      - name: Resolve maritime webhook secret
        shell: bash
        env:
          WEBHOOK_SECRET_GITHUB: '${{ secrets.PADDLE_MARITIME_WEBHOOK_SECRET }}'
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$WEBHOOK_SECRET_GITHUB"
          if [ -z "$WEBHOOK_SECRET" ]; then
            SECRET_FILE="$RUNNER_TEMP/maritime-webhook-secret-existing"
            if npx firebase-tools functions:secrets:access PADDLE_MARITIME_WEBHOOK_SECRET --project carbon-web-1265b > "$SECRET_FILE" 2>/dev/null; then
              WEBHOOK_SECRET="$(cat "$SECRET_FILE")"
            fi
          fi
          test -n "$WEBHOOK_SECRET"
          echo "::add-mask::$WEBHOOK_SECRET"
          SECRET_FILE="$RUNNER_TEMP/maritime-webhook-secret"
          printf '%s' "$WEBHOOK_SECRET" > "$SECRET_FILE"
          npx firebase-tools functions:secrets:set PADDLE_MARITIME_WEBHOOK_SECRET --project carbon-web-1265b --data-file "$SECRET_FILE"

      - name: Validate fixed Paddle catalog binding
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_399" = "pri_01m1rdd20amd3730r561vckwm3"
          grep -q 'MARITIME_DOSSIER_1Y_399_USD' functions/maritime-commerce-v1.js
          grep -q '39900' functions/maritime-commerce-v1.js
          grep -q 'pri_01m1rdd20amd3730r561vckwm3' functions/maritime-commerce-v1.js
          grep -q 'pri_01m1rdd20amd3730r561vckwm3' functions/maritime-commerce-webhook-v1.js

      - name: Validate code
        run: |
          node --check functions/maritime-commerce-v1.js
          node --check functions/maritime-commerce-webhook-v1.js
          node --check functions/main.js
          npm run typecheck

      - name: Build production site with Paddle catalog binding
        run: npm run build

      - name: Deploy commerce functions and Firestore index
        run: |
          npx firebase-tools deploy \
            --project carbon-web-1265b \
            --only functions:skdmhesapla:maritimeCommerceApi,functions:skdmhesapla:maritimeCommerceWebhookApi,firestore:indexes \
            --non-interactive

      - name: Deploy hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
          channelId: live
          projectId: carbon-web-1265b
          target: skdmhesapla

      - name: Smoke boundaries
        shell: bash
        run: |
          set -euo pipefail
          pricing=$(curl -fsSL https://skdmhesapla.com/fiyatlandirma/)
          echo "$pricing" | grep -q '399'
          commerce_code=$(curl -sS -o /tmp/commerce -w "%{http_code}" 'https://skdmhesapla.com/api/maritime-commerce/status?year=2026' || true)
          webhook_code=$(curl -sS -o /tmp/webhook -w "%{http_code}" 'https://skdmhesapla.com/api/maritime-commerce/webhook' || true)
          test "$commerce_code" = "401"
          test "$webhook_code" = "405"
