name: teb232-maritime-one-shot-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teb232-maritime-one-shot-deploy.yml'
  workflow_dispatch:

concurrency:
  group: teb232-maritime-one-shot-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run typecheck
      - name: Build production site
        env:
          NEXT_PUBLIC_PADDLE_ENV: production
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: '${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}'
          NEXT_PUBLIC_PADDLE_PRICE_SEALED: '${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_SEALED }}'
          NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_349: '${{ secrets.NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_349 }}'
        run: npm run build
      - name: Prepare E2E-only Cloud Functions manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'functions/main.js';
          let s = fs.readFileSync(p, 'utf8');
          s = s
            .replace(/const maritimeCommerceExports = require\("\.\/maritime-commerce-v1\.js"\);\n/, '')
            .replace(/const maritimeCommerceWebhookExports = require\("\.\/maritime-commerce-webhook-v1\.js"\);\n/, '')
            .replace(/\s+maritimeCommerceApi: maritimeCommerceExports\.maritimeCommerceApi,\n/, '\n')
            .replace(/\s+maritimeCommerceWebhookApi: maritimeCommerceWebhookExports\.maritimeCommerceWebhookApi,\n/, '\n');
          fs.writeFileSync(p, s);
          NODE
          node -e "const m=require('./functions/main.js'); if(!m.maritimeApi||!m.maritimeEvidenceApi||m.maritimeCommerceApi||m.maritimeCommerceWebhookApi) process.exit(1); console.log('E2E function manifest PASS')"
      - name: Deploy maritime persistence and evidence functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
        shell: bash
        run: |
          set -euo pipefail
          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx firebase-tools deploy --project carbon-web-1265b --only functions:skdmhesapla:maritimeApi,functions:skdmhesapla:maritimeEvidenceApi --non-interactive
          rm -f "$SA_FILE"
      - name: Restore repository Functions manifest before hosting
        if: always()
        run: git checkout -- functions/main.js
      - name: Deploy hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
          channelId: live
          projectId: carbon-web-1265b
          target: skdmhesapla
      - name: Verify maritime operational rewrites are live
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..15}; do
            code=$(curl -sS -o /tmp/m -w '%{http_code}' https://skdmhesapla.com/api/maritime/health || true)
            ev=$(curl -sS -o /tmp/e -w '%{http_code}' https://skdmhesapla.com/api/maritime/evidence/health || true)
            if [ "$code" = "401" ] && [ "$ev" = "401" ]; then exit 0; fi
            sleep 5
          done
          cat /tmp/m || true
          cat /tmp/e || true
          exit 1
