name: teb232-maritime-one-shot-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teb232-maritime-one-shot-deploy.yml'
  workflow_dispatch:

concurrency:
  group: teb232-maritime-one-shot-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run typecheck
      - name: Build production site
        env:
          NEXT_PUBLIC_PADDLE_ENV: production
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: '${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}'
          NEXT_PUBLIC_PADDLE_PRICE_SEALED: '${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_SEALED }}'
          NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_349: '${{ secrets.NEXT_PUBLIC_PADDLE_MARITIME_PRICE_ID_349 }}'
        run: npm run build
      - name: Prepare minimal E2E-only Cloud Functions manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > functions/main.js <<'JS'
          "use strict";
          const maritimeExports = require("./maritime-backend-v2.js");
          const maritimeEvidenceExports = require("./maritime-evidence-v3.js");
          module.exports = {
            maritimeApi: maritimeExports.maritimeApi,
            maritimeEvidenceApi: maritimeEvidenceExports.maritimeEvidenceApi,
          };
          JS
          node <<'NODE'
          const fs = require('fs');
          const p = 'functions/maritime-evidence-v3.js';
          let s = fs.readFileSync(p, 'utf8');
          const needle = '  maxInstances: 20,\n}, async (req, res) => {';
          if (!s.includes(needle)) throw new Error('maritimeEvidenceApi runtime options marker not found');
          s = s.replace(needle, '  maxInstances: 20,\n  serviceAccount: process.env.MARITIME_EVIDENCE_SERVICE_ACCOUNT || undefined,\n}, async (req, res) => {');
          fs.writeFileSync(p, s);
          NODE
          grep -q 'maritimeApi' functions/main.js
          grep -q 'maritimeEvidenceApi' functions/main.js
          grep -q 'MARITIME_EVIDENCE_SERVICE_ACCOUNT' functions/maritime-evidence-v3.js
          ! grep -q 'maritimeCommerce' functions/main.js
          echo 'Minimal E2E function manifest + evidence runtime identity hook PASS'
      - name: Deploy maritime persistence and evidence functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
        shell: bash
        run: |
          set -euo pipefail
          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          export MARITIME_EVIDENCE_SERVICE_ACCOUNT="$(node -e "const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); if(!x.client_email) process.exit(2); process.stdout.write(x.client_email)")"
          echo 'Evidence runtime identity resolved from deployment credential.'
          npx firebase-tools deploy --project carbon-web-1265b --only functions:skdmhesapla:maritimeApi,functions:skdmhesapla:maritimeEvidenceApi --non-interactive
          rm -f "$SA_FILE"
      - name: Restore repository Functions sources
        if: always()
        run: git checkout -- functions/main.js functions/maritime-evidence-v3.js
      - name: Prepare temporary hosting config without undeployed commerce rewrites
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('firebase.json','utf8'));
          const host = Array.isArray(cfg.hosting) ? cfg.hosting[0] : cfg.hosting;
          host.rewrites = (host.rewrites || []).filter((r) => !['maritimeCommerceApi','maritimeCommerceWebhookApi'].includes(r.function?.functionId));
          fs.writeFileSync('firebase.json', JSON.stringify(cfg, null, 2) + '\n');
          NODE
          grep -q 'maritimeEvidenceApi' firebase.json
          grep -q 'maritimeApi' firebase.json
          ! grep -q 'maritimeCommerceApi' firebase.json
      - name: Deploy hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBON_WEB_1265B }}'
          channelId: live
          projectId: carbon-web-1265b
          target: skdmhesapla
      - name: Verify maritime operational rewrites are live
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..15}; do
            code=$(curl -sS -o /tmp/m -w '%{http_code}' https://skdmhesapla.com/api/maritime/health || true)
            ev=$(curl -sS -o /tmp/e -w '%{http_code}' https://skdmhesapla.com/api/maritime/evidence/health || true)
            if [ "$code" = "401" ] && [ "$ev" = "401" ]; then
              echo 'Live maritime persistence + evidence API boundaries verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live maritime operational verification failed.'
          cat /tmp/m || true
          cat /tmp/e || true
          exit 1