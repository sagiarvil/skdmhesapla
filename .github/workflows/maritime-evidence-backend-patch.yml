name: maritime-evidence-backend-patch

on:
  push:
    branches: [feature/maritime-evidence-chain-v3]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maritime-evidence-chain-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply binary evidence authority patch
        run: node scripts/apply-maritime-evidence-backend-patch.mjs
      - name: Syntax check
        run: node --check functions/maritime-backend-v2.js
      - name: Commit patched backend
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/maritime-backend-v2.js
          git commit -m "feat(maritime): make binary evidence server-authoritative [skip ci]"
          git push origin HEAD:feature/maritime-evidence-chain-v3
