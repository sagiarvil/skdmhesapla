name: release-gate-v8

on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'seo-**']

concurrency:
  group: release-gate-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Root dependencies
        run: npm ci
      - name: Functions dependencies
        run: npm ci --prefix functions
      - name: Regulatory SSOT gate
        run: node scripts/seo/validate-regulatory-ssot.mjs
      - name: Regulatory implementation-chain gate
        run: node scripts/seo/validate-regulatory-chain.mjs
      - name: Regulatory detail-link gate
        run: node scripts/seo/validate-regulatory-links.mjs
      - name: Verification workflow separation gate
        run: node scripts/seo/validate-verification-workflow.mjs
      - name: Search revenue + query ownership gate
        run: node scripts/seo/validate-search-revenue.mjs
      - name: Index / AI authority parity gate
        run: npm run seo:parity
      - name: Functions core derle
        run: npm run build:functions-core
      - name: Güvenlik testleri
        run: npm run test:security:v8
      - name: Public operator identity privacy
        run: npm run test:privacy:identity
      - name: Trust boundary + sentetik veri + RM otorite
        run: npm run test:governance:v8
      - name: Ödeme/mühür testleri
        run: npm run test:payment-seal
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Production build
        run: npm run build
      - name: GEO / ChatGPT full audit
        run: npm run geo:full-audit
      - name: Release gate
        run: npm run release:gate:v8
