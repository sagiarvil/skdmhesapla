name: release-gate-v8

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

concurrency:
  group: release-gate-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Root dependencies
        run: npm ci
      - name: Functions dependencies
        run: npm ci --prefix functions
      - name: Functions core derle
        run: npm run build:functions-core
      - name: Güvenlik testleri
        run: npm run test:security:v8
      - name: Trust boundary + sentetik veri + RM otorite
        run: npm run test:governance:v8
      - name: Ödeme/mühür testleri
        run: npm run test:payment-seal
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: GEO / ChatGPT full audit
        run: npm run geo:full-audit
      - name: Release gate
        run: npm run release:gate:v8
